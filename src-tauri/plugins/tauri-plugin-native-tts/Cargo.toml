[package]
name = "tauri-plugin-native-tts"
version = "0.1.0"
description = "TTS nativo del dispositivo para TuaLingua"
authors = ["TuaLingua"]
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-native-tts"

[lib]
name = "tauri_plugin_native_tts"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tts = "0.26"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
