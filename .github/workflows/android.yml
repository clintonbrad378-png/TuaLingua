name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (arm64)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar Tauri CLI (necesario para Gradle)
        run: |
          curl -sSL -o /tmp/cargo-tauri.tgz \
            https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-x86_64-unknown-linux-gnu.tgz
          tar -xzf /tmp/cargo-tauri.tgz -C /tmp
          mkdir -p "$HOME/.cargo/bin"
          mv /tmp/cargo-tauri "$HOME/.cargo/bin/cargo-tauri"
          chmod +x "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version

      - name: Instalar NDK ${{ env.NDK_VERSION }}
        run: |
          SDKMGR="$(command -v sdkmanager || echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/gen/android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Instalar dependencias JS
        run: npm ci

      - name: Verificar clips de audio
        run: python3 scripts/check_audio.py

      - name: Build APK (debug)
        run: npm run tauri -- android build --debug --apk --target aarch64

      - name: Configurar firma de release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEYSTORE_PASSWORD}
          EOF

      - name: Build APK (release firmado)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: npm run tauri -- android build --apk --target aarch64

      - name: Recopilar APKs
        run: |
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: TuaLingua-debug-arm64
          path: out/*debug*.apk
          if-no-files-found: error

      - name: Subir APK release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: TuaLingua-release-arm64
          path: out/*release*.apk
          if-no-files-found: error

      - name: Publicar release en tags v*
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
